# Common configuration only. Environment-specific values live in application-{dev,prod,test}.yml
# and secrets always come from environment variables.
spring:
  application:
    name: ecommerce
  profiles:
    # Local convenience. Production MUST set SPRING_PROFILES_ACTIVE=prod explicitly.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false            # no lazy loading from the web layer
    hibernate:
      ddl-auto: validate           # Flyway owns the schema, Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 strings, e.g. 2026-10-06T10:15:30Z
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}               # Render injects PORT
  shutdown: graceful
  forward-headers-strategy: framework   # correct scheme/host behind Render / AWS load balancers
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
